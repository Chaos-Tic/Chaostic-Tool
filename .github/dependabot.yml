version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 6.12.0 decrements None's reference count on Qt void calls on Python 3.11.
    ignore:
      - dependency-name: "PySide6"
        versions: ["6.12.0"]
      # Native packages ship rich 13.7 (Ubuntu 24.04 / Debian Trixie); keep the
      # floor aligned and let security patches through, but not major/minor bumps.
      - dependency-name: "rich"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

