name: CI/CD Pipeline
on:
  push:
    branches: [main, refactor/shared-core]
    tags: ['v*']
  pull_request:
    branches: [main, refactor/shared-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch push and its pull_request event represent the same revision.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-classify-changes.sh
  unit-tests:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-build.txt
      - name: Install system dependencies for headless Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-xkb1 libxcb-render-util0 libxcb-image0 libxcb-util1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            xvfb xdotool fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run all unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Native X11 visual contracts
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python scripts/check-native-ui.py
          CHAOSTIC_TEST_FONT='DejaVu Sans' QT_FONT_DPI=144 xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python scripts/check-native-ui.py
      - name: Check documentation links
        run: python scripts/check-docs.py
      - name: Check shell scripts syntax
        run: bash -n install.sh uninstall.sh packaging/linux/*.sh packaging/debian/*.sh packaging/arch/*.sh scripts/*.sh

  native-source:
    name: Debian source package check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package build and smoke-test in clean Debian Trixie
        run: docker run --rm -v "$PWD:/src:ro" debian:trixie-slim sh /src/scripts/check-source-package.sh

  build-matrix:
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') && needs.unit-tests.result == 'success' && needs.native-source.result == 'success' }}
    name: Build ${{ matrix.name }}
    needs: [changes, unit-tests, native-source]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, name: windows-x64, arch: x64}
          - {os: windows-11-arm, name: windows-arm64, arch: arm64}
          - {os: ubuntu-22.04, name: linux-x64, arch: x64}
          - {os: ubuntu-24.04-arm, name: linux-arm64, arch: arm64}
          - {os: macos-15-intel, name: macos-x64, arch: x64}
          - {os: macos-15, name: macos-arm64, arch: arm64}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-build.txt
      - name: Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-xkb1 libxcb-render-util0 libxcb-image0 libxcb-util1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            xvfb xdotool fonts-dejavu-core
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-build.txt
      - name: Verified AppImage tools and runtime
        if: runner.os == 'Linux'
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$APP_ARCH" = x64 ]; then
            arch=x86_64
            tool_hash=95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6
            runtime_hash=617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
          else
            arch=aarch64
            tool_hash=a595ea34cd6136c7f595e9dcbb16f3e9725d7610efb9e43b38c3c6e86cafc270
            runtime_hash=9a72a744d221576c9347ec074243acc5c3c7568896b12714e0e82e9f0bf47900
          fi
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          runtime="$RUNNER_TEMP/appimage-runtime"
          curl -fsSL --retry 3 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage" -o "$tool"
          curl -fsSL --retry 3 "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$arch" -o "$runtime"
          printf '%s  %s\n' "$tool_hash" "$tool" "$runtime_hash" "$runtime" | sha256sum -c -
          chmod +x "$tool"
          echo "APPIMAGETOOL_PATH=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_PATH=$runtime" >> "$GITHUB_ENV"
      - name: Verified Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setupPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setupPath
          if ((Get-FileHash $setupPath -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          $setup = Start-Process $setupPath -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/NOICONS', '/TASKS=""', ('/DIR="' + $compilerRoot + '"') -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Compiler setup failed: $($setup.ExitCode)" }
          "ISCC_PATH=$compilerRoot\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test and build distributable application
        run: python scripts/build-desktop.py
      - name: Test packaged application
        run: python scripts/smoke-desktop.py
      - name: Check Windows shortcut identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appId = python -c "from desktop.branding import WINDOWS_APP_ID; print(WINDOWS_APP_ID)"
          $destination = Join-Path $env:RUNNER_TEMP 'ChaosticTool-taskbar-check'
          $group = 'ChaosticTool'
          $installer = Get-ChildItem release/ChaosticTool-Setup-*.exe | Select-Object -First 1
          $setupLog = Join-Path $env:RUNNER_TEMP 'chaostic-installer.log'
          $setupArgs = @(('/LOG="' + $setupLog + '"'), '/VERYSILENT', '/CURRENTUSER', '/NORESTART', '/NOCLOSEAPPLICATIONS', '/TASKS=""', ('/DIR="' + $destination + '"'))
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList $setupArgs -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          try {
            $shortcutFolder = (Resolve-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/$group")).Path
            $shortcutPath = Join-Path $shortcutFolder 'ChaosticTool Desktop.lnk'
            if (-not (Test-Path -LiteralPath $shortcutPath)) { throw 'Installed shortcut is missing' }
            $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
            $shell = New-Object -ComObject Shell.Application
            $shellFolder = $shell.Namespace([string]$shortcutFolder)
            if ($null -eq $shellFolder) { throw "Cannot inspect shortcut folder: $shortcutFolder" }
            $item = $shellFolder.ParseName('ChaosticTool Desktop.lnk')
            if ($item.ExtendedProperty('System.AppUserModel.ID') -ne $appId) { throw 'Shortcut taskbar identity mismatch' }
            $expectedIcon = (Resolve-Path -LiteralPath (Join-Path $destination '_internal/desktop/assets/icon.ico')).Path
            if (($shortcut.IconLocation -split ',')[0] -ne $expectedIcon -or -not (Test-Path -LiteralPath $expectedIcon)) { throw 'Shortcut icon resource mismatch' }
            if ($shortcut.TargetPath -ne (Join-Path $destination 'ChaosticTool.exe')) { throw 'Shortcut target mismatch' }
          } finally {
            $uninstall = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          }
      - name: Check Linux installation and removal
        if: runner.os == 'Linux'
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/chaostic-install"
          sh dist/ChaosticTool/install.sh
          test -f "$XDG_DATA_HOME/applications/chaostictool.desktop"
          "$XDG_DATA_HOME/ChaosticTool/application/ChaosticTool" --smoke-test
          sh "$XDG_DATA_HOME/ChaosticTool/application/uninstall.sh"
          test ! -e "$XDG_DATA_HOME/ChaosticTool/application"
      - name: Test AppImage without FUSE
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export CHAOSTIC_DESKTOP_HOME="$RUNNER_TEMP/appimage-smoke"
          ./release/*.AppImage --smoke-test
          python -c 'import json,os; from pathlib import Path; result=json.loads((Path(os.environ["CHAOSTIC_DESKTOP_HOME"])/"smoke-result.json").read_text()); assert result["status"]=="success", result'
      - name: Build native Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cmake rpm
          cmake -S . -B build/native-packages -DCMAKE_INSTALL_PREFIX=/usr -DCHAOSTIC_BUNDLE_DIR="$PWD/dist/ChaosticTool"
          cpack --config build/native-packages/CPackConfig.cmake -G 'DEB;RPM' -B release
          cd release
          sha256sum *.deb *.rpm > linux-native-SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
            release/*.exe
            release/*.exe.sha256
            release/*.dmg
            release/*.dmg.sha256
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.deb
            release/*.rpm
            release/linux-native-SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14

  linux-package-install:
    name: Package smoke test (${{ matrix.image }})
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, image: 'debian:trixie-slim' }
          - { format: deb, image: 'ubuntu:24.04' }
          - { format: rpm, image: 'fedora:43' }
          - { format: rpm, image: 'fedora:44' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux-x64
          path: packages
      - name: Test installation in clean ${{ matrix.image }} container
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" "${{ matrix.image }}" sh -ec '
            export DEBIAN_FRONTEND=noninteractive QT_QPA_PLATFORM=offscreen
            if command -v apt-get >/dev/null; then
              apt-get update -qq
              apt-get install -y -qq /packages/*.deb
            else
              dnf install -y -q /packages/*.rpm
            fi
            export CHAOSTIC_DESKTOP_HOME=/tmp/container-smoke
            chaostictool-desktop --smoke-test
            grep -q "\"status\": \"success\"" "$CHAOSTIC_DESKTOP_HOME/smoke-result.json"
            if command -v apt-get >/dev/null; then
              apt-get remove -y -qq chaostictool
            else
              dnf remove -y -q chaostictool
            fi
            test ! -e /usr/bin/chaostictool && test ! -e /usr/bin/chaostictool-desktop
          '

  release:
    name: Publish Release (tag ${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, native-source, build-matrix, linux-package-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Compute SHA-256 fingerprints and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          (cd dist && for f in *; do if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then sha256sum "$f"; fi; done > SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(jq -r .isDraft release-state.json)" != "true" ]; then
              echo "::notice::Release already published; keeping its existing assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ChaosticTool ${TAG#v}" --generate-notes --draft --verify-tag
          fi
          find dist -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Trigger Fedora COPR webhook
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          if [ -n "$COPR_WEBHOOK" ]; then
            curl -fsS -X POST "$COPR_WEBHOOK"
            echo "COPR webhook triggered"
          fi

  ppa:
    name: Publish to Launchpad PPA
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign and submit PPA packages
        env:
          PPA_SIGNING_KEY: ${{ secrets.PPA_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$PPA_SIGNING_KEY" ]; then
            echo "::notice::PPA_SIGNING_KEY not configured; skipping Launchpad upload."
            exit 0
          fi
          bash packaging/debian/ppa.sh "${TAG#v}"

  aur:
    name: Publish to Arch Linux AUR
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY not configured; skipping AUR update."
            exit 0
          fi
          bash packaging/arch/aur.sh "${TAG#v}"

  apt:
    name: Refresh the Chaos-Tic apt repository
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch apt repository rebuild
        env:
          APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$APT_DISPATCH_TOKEN" ]; then
            echo "::notice::APT_DISPATCH_TOKEN not configured; the apt repository refreshes on its hourly schedule instead."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $APT_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Chaos-Tic/apt/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"tag\":\"${TAG}\"}}"
          echo "Chaos-Tic/apt rebuild dispatched for ${TAG}."
