name: Update public edition versions
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update-release-metadata.py
