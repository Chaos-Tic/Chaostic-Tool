name: Windows Desktop

on:
  push:
    branches: [main, desktop/windows-app]
    paths:
      - 'desktop/**'
      - 'core/tools.py'
      - 'chaostic_desktop.py'
      - 'requirements-*.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'packaging/windows/**'
      - 'docs/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare verified Inno Setup compiler
        run: |
          $setupPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://files.jrsoftware.org/is/6/innosetup-6.7.3.exe' -OutFile $setupPath
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          if ((Get-FileHash $setupPath -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          $setup = Start-Process $setupPath -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/NOICONS', '/TASKS=""', ('/DIR="' + $compilerRoot + '"') -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Compiler setup failed: $($setup.ExitCode)" }
          "ISCC_PATH=$compilerRoot\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test and build application and installer
        run: ./scripts/build-desktop.ps1 -Python (Get-Command python).Source -Iscc $env:ISCC_PATH
      - name: Smoke test packaged application
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:CHAOSTIC_DESKTOP_HOME = Join-Path $env:RUNNER_TEMP 'chaostic-smoke'
          $app = Start-Process './dist/ChaosticTool/ChaosticTool.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { Stop-Process -Id $app.Id; throw 'Smoke test timed out' }
          $result = Get-Content (Join-Path $env:CHAOSTIC_DESKTOP_HOME 'smoke-result.json') -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or $result.status -ne 'success') { throw 'Packaged diagnostic failed' }
      - name: Write checksums
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChaosticTool-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
