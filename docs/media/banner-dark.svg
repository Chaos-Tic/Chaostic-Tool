<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">ChaosticTool — Security reconnaissance, orchestrated.</title>
<desc id="desc">Frosted-glass ChaosticTool dark interface with orchestrated reconnaissance phases, PTY terminal execution and real-time offensive pipeline controls.</desc>
<defs>
<clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".55"/></filter>
<linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".3" stop-color="#818cf8"/><stop offset=".6" stop-color="#c084fc"/><stop offset=".85" stop-color="#fb7185"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".15"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b" stop-opacity=".65"/><stop offset="1" stop-color="#0f172a" stop-opacity=".75"/></linearGradient>
<linearGradient id="term" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b0f19"/></linearGradient>
<linearGradient id="phase-active" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="300" fill="#0b0f19"/>
<g filter="url(#soft)">
<circle cx="780" cy="50" r="180" fill="#0369a1" fill-opacity=".35"/>
<circle cx="1120" cy="110" r="200" fill="#581c87" fill-opacity=".4"/>
<circle cx="940" cy="310" r="180" fill="#831843" fill-opacity=".3"/>
<circle cx="280" cy="300" r="190" fill="#1e1b4b" fill-opacity=".45"/>
<circle cx="90" cy="20" r="160" fill="#0c4a6e" fill-opacity=".3"/>
</g>
</g>
<g transform="translate(680, 36)" filter="url(#lift)">
<rect width="480" height="228" rx="20" fill="url(#glass)"/>
<rect width="480" height="228" rx="20" fill="url(#sheen)"/>
<rect x=".6" y=".6" width="478.8" height="226.8" rx="19.4" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/>
<rect x="0" y="0" width="480" height="228" rx="20" fill="none" stroke="url(#film)" stroke-width="1.5" stroke-opacity=".75"/>

<!-- Header bar -->
<circle cx="24" cy="20" r="5" fill="#f43f5e" fill-opacity=".9"/>
<circle cx="40" cy="20" r="5" fill="#fbbf24" fill-opacity=".9"/>
<circle cx="56" cy="20" r="5" fill="#10b981" fill-opacity=".9"/>
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, sans-serif">
<rect x="180" y="10" width="220" height="20" rx="10" fill="#ffffff" fill-opacity=".06"/>
<circle cx="194" cy="20" r="3.5" fill="#38bdf8"/>
<text x="204" y="24" fill="#cbd5e1" font-size="11" font-weight="600">target: 10.0.0.1/24 · active</text>
<rect x="408" y="10" width="58" height="20" rx="10" fill="#0284c7" fill-opacity=".25"/>
<text x="437" y="24" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">READY</text>

<!-- Left mini terminal panel -->
<g transform="translate(16, 42)">
<rect width="246" height="170" rx="12" fill="url(#term)"/>
<rect x=".5" y=".5" width="245" height="169" rx="11.5" fill="none" stroke="#1e293b" stroke-width="1"/>
<g font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="10">
<text x="12" y="22" fill="#38bdf8">$ chaostictool run discovery</text>
<text x="12" y="38" fill="#64748b">[*] Loading 32 offensive profiles</text>
<text x="12" y="54" fill="#64748b">[*] Spawning isolated PTY session</text>
<text x="12" y="72" fill="#34d399">[+] 80/tcp   open  http (nginx 1.24)</text>
<text x="12" y="88" fill="#34d399">[+] 443/tcp  open  https (TLS 1.3)</text>
<text x="12" y="104" fill="#38bdf8">[+] 88/tcp   open  kerberos (AD DS)</text>
<text x="12" y="120" fill="#fbbf24">[!] Discovery complete (3/3 alive)</text>
<rect x="12" y="134" width="80" height="22" rx="6" fill="#0284c7" fill-opacity=".25" stroke="#38bdf8" stroke-width=".8"/>
<text x="52" y="149" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">TUI ACTIVE</text>
<rect x="100" y="134" width="70" height="22" rx="6" fill="#10b981" fill-opacity=".2" stroke="#34d399" stroke-width=".8"/>
<text x="135" y="149" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">0.42s</text>
</g>
</g>

<!-- Right pipeline phases -->
<g transform="translate(274, 42)">
<!-- Phase 1: Discovery (Active) -->
<g filter="url(#lift)">
<rect width="190" height="48" rx="10" fill="url(#phase-active)"/>
<rect width="190" height="48" rx="10" fill="url(#sheen)"/>
<rect x=".5" y=".5" width="189" height="47" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1"/>
</g>
<circle cx="22" cy="24" r="10" fill="#fff" fill-opacity=".25"/>
<text x="22" y="28" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
<text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Discovery</text>
<text x="40" y="37" fill="#e0f2fe" font-size="10">nmap · rustscan · alive</text>
<circle cx="174" cy="24" r="4" fill="#34d399"/>

<!-- Phase 2: Web Surface -->
<rect y="56" width="190" height="48" rx="10" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1"/>
<circle cx="22" cy="80" r="10" fill="#ffffff" fill-opacity=".06"/>
<text x="22" y="84" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">2</text>
<text x="40" y="78" fill="#e2e8f0" font-size="12" font-weight="600">Web Surface</text>
<text x="40" y="93" fill="#64748b" font-size="10">httpx · katana · ffuf</text>

<!-- Phase 3: Active Directory -->
<rect y="112" width="190" height="48" rx="10" fill="#1e293b" fill-opacity=".4" stroke="#334155" stroke-opacity=".6" stroke-width="1"/>
<circle cx="22" cy="136" r="10" fill="#ffffff" fill-opacity=".06"/>
<text x="22" y="140" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">3</text>
<text x="40" y="134" fill="#94a3b8" font-size="12" font-weight="600">Active Directory</text>
<text x="40" y="149" fill="#64748b" font-size="10">bloodhound · netexec</text>

<!-- Micro action badge -->
<rect y="168" width="190" height="2" rx="1" fill="#1e293b"/>
</g>
</g>
</g>

<!-- Left typography brand block -->
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, sans-serif">
<text x="64" y="68" fill="#38bdf8" font-size="11.5" font-weight="600" letter-spacing="3">SECURITY RECONNAISSANCE · ORCHESTRATED</text>
<text x="60" y="144" fill="#f8fafc" font-size="62" font-weight="700" letter-spacing="-2">ChaosticTool</text>
<text x="64" y="186" fill="#e2e8f0" font-size="21" font-weight="500">One reconnaissance pipeline. Terminal precision or liquid glass control.</text>
<text x="64" y="238" fill="#94a3b8" font-size="13.5">5 structured phases · 32 offensive profiles · Real-time PTY terminal · Linux &amp; Windows</text>
</g>
</svg>
