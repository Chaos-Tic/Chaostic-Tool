<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">ChaosticTool — Security reconnaissance, orchestrated.</title>
<desc id="desc">Dual-interface control surface: Liquid Glass desktop workspace and Terminal Precision HUD console for orchestrated offensive security reconnaissance.</desc>
<defs>
<clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/></filter>
<linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".25" stop-color="#818cf8"/><stop offset=".5" stop-color="#c084fc"/><stop offset=".75" stop-color="#f43f5e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".98"/></linearGradient>
<linearGradient id="term" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#090d16"/></linearGradient>
<linearGradient id="phase-glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="300" fill="#f8fafc"/>
<g filter="url(#soft)">
<circle cx="820" cy="40" r="190" fill="#38bdf8" fill-opacity=".20"/>
<circle cx="1140" cy="110" r="210" fill="#a855f7" fill-opacity=".16"/>
<circle cx="980" cy="310" r="180" fill="#f43f5e" fill-opacity=".14"/>
<circle cx="280" cy="300" r="190" fill="#818cf8" fill-opacity=".16"/>
<circle cx="90" cy="20" r="160" fill="#0284c7" fill-opacity=".16"/>
</g>
</g>

<!-- Left typography brand block (bounded at x=500, never collides) -->
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, sans-serif">
<text x="56" y="66" fill="#0284c7" font-size="11.5" font-weight="600" letter-spacing="3">SECURITY RECONNAISSANCE · ORCHESTRATED</text>
<text x="52" y="138" fill="#0f172a" font-size="58" font-weight="700" letter-spacing="-2">ChaosticTool</text>
<text x="56" y="180" fill="#1e293b" font-size="19" font-weight="500">One reconnaissance pipeline.</text>
<text x="56" y="206" fill="#0284c7" font-size="19" font-weight="500">Terminal precision or liquid glass control.</text>
<text x="56" y="250" fill="#64748b" font-size="13">5 assessment phases · 32 offensive profiles · Real-time PTY · Linux &amp; Windows</text>
</g>

<!-- Right orchestrated control surface (starts at x=560) -->
<g transform="translate(560, 24)" filter="url(#lift)">
<!-- Liquid Glass Desktop main container -->
<rect width="590" height="252" rx="18" fill="url(#glass)"/>
<rect width="590" height="252" rx="18" fill="url(#sheen)"/>
<rect x=".6" y=".6" width="588.8" height="250.8" rx="17.4" fill="none" stroke="#0f172a" stroke-opacity=".08" stroke-width="1.2"/>
<rect x="0" y="0" width="590" height="252" rx="18" fill="none" stroke="url(#film)" stroke-width="1.4" stroke-opacity=".8"/>

<!-- Desktop Header Bar -->
<circle cx="24" cy="20" r="4.5" fill="#f43f5e"/>
<circle cx="39" cy="20" r="4.5" fill="#fbbf24"/>
<circle cx="54" cy="20" r="4.5" fill="#10b981"/>

<!-- Real HUD status pills -->
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, sans-serif">
<rect x="135" y="9" width="180" height="22" rx="11" fill="#0f172a" fill-opacity=".05" stroke="#0f172a" stroke-opacity=".1" stroke-width=".8"/>
<circle cx="149" cy="20" r="3.5" fill="#0284c7"/>
<text x="159" y="24" fill="#334155" font-size="10.5" font-weight="600">target: 10.0.0.1/24</text>

<rect x="323" y="9" width="112" height="22" rx="11" fill="#0f172a" fill-opacity=".05" stroke="#0f172a" stroke-opacity=".1" stroke-width=".8"/>
<text x="379" y="24" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">ROUTE: <tspan fill="#059669">DIRECT</tspan></text>

<rect x="502" y="9" width="68" height="22" rx="11" fill="#10b981" fill-opacity=".15" stroke="#059669" stroke-opacity=".4" stroke-width=".8"/>
<text x="536" y="24" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">READY</text>
</g>

<!-- Left Sub-Panel: Authentic Terminal Precision CLI HUD -->
<g transform="translate(18, 42)">
<rect width="280" height="194" rx="10" fill="url(#term)"/>
<rect x=".5" y=".5" width="279" height="193" rx="9.5" fill="none" stroke="#1e293b" stroke-width="1"/>
<g font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="9">
<!-- Masthead Box -->
<text x="10" y="20" fill="#38bdf8">╭─────────────────────────────╮</text>
<text x="10" y="32" fill="#38bdf8">│ <tspan fill="#f8fafc" font-weight="700">Chaostic</tspan><tspan fill="#38bdf8" font-weight="700">Tool</tspan>               │</text>
<text x="10" y="44" fill="#38bdf8">│ <tspan fill="#64748b">Targets, tools &amp; results.  </tspan> │</text>
<text x="10" y="56" fill="#38bdf8">│ <tspan fill="#475569">CHAOSTICTOOL / LINUX CLI   </tspan> │</text>
<text x="10" y="68" fill="#38bdf8">╰─────────────────────────────╯</text>
<!-- Telemetry strip -->
<text x="10" y="86" fill="#475569">SESSION ───────────────────────</text>
<text x="10" y="98" fill="#64748b">TARGET  <tspan fill="#f8fafc">10.0.0.1/24</tspan>  ROUTE <tspan fill="#34d399">DIRECT</tspan></text>
<!-- Phases overview -->
<text x="10" y="116" fill="#475569">ASSESSMENT PHASES ────────────</text>
<text x="10" y="128" fill="#38bdf8">1 OSINT &amp; Recon   <tspan fill="#64748b">subfinder · whois</tspan></text>
<text x="10" y="140" fill="#94a3b8">2 Network Scan    <tspan fill="#64748b">nmap · rustscan</tspan></text>
<!-- Direct action dock -->
<text x="10" y="158" fill="#475569">ACTIONS ──────────────────────</text>
<text x="10" y="170" fill="#38bdf8">[0] <tspan fill="#cbd5e1">Target</tspan>  [/] <tspan fill="#cbd5e1">Search</tspan>  [q] <tspan fill="#cbd5e1">Quit</tspan></text>
<text x="10" y="184" fill="#34d399">READY <tspan fill="#cbd5e1">&gt; </tspan><tspan fill="#38bdf8">_</tspan></text>
</g>
</g>

<!-- Right Sub-Panel: Liquid Glass Phase Workflow Cards -->
<g transform="translate(312, 42)" font-family="Geist, 'Segoe UI', Inter, -apple-system, sans-serif">
<!-- Phase 1 Card (Active) -->
<g filter="url(#lift)">
<rect width="258" height="58" rx="10" fill="url(#phase-glow)"/>
<rect width="258" height="58" rx="10" fill="url(#sheen)"/>
<rect x=".5" y=".5" width="257" height="57" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1"/>
</g>
<circle cx="22" cy="29" r="12" fill="#ffffff" fill-opacity=".2"/>
<text x="22" y="33" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">01</text>
<text x="42" y="24" fill="#ffffff" font-size="11.5" font-weight="700">OSINT &amp; Passive Recon</text>
<text x="42" y="42" fill="#e0f2fe" font-size="9.5">whois · subfinder · shodan · amass</text>
<circle cx="242" cy="29" r="3.5" fill="#34d399"/>

<!-- Phase 2 Card (Queued) -->
<rect y="68" width="258" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="22" cy="97" r="12" fill="#0f172a" fill-opacity=".05"/>
<text x="22" y="101" text-anchor="middle" fill="#475569" font-size="11" font-weight="700">02</text>
<text x="42" y="92" fill="#0f172a" font-size="11.5" font-weight="600">Network Scan &amp; Ports</text>
<text x="42" y="110" fill="#64748b" font-size="9.5">nmap · rustscan · masscan · naabu</text>
<rect x="232" y="87" width="18" height="18" rx="4" fill="#0f172a" fill-opacity=".05"/>
<text x="241" y="100" text-anchor="middle" fill="#64748b" font-size="9" font-weight="700">02</text>

<!-- Phase 3 Card (Active Directory) -->
<rect y="136" width="258" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-opacity=".8" stroke-width="1"/>
<circle cx="22" cy="165" r="12" fill="#0f172a" fill-opacity=".05"/>
<text x="22" y="169" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">08</text>
<text x="42" y="160" fill="#1e293b" font-size="11.5" font-weight="600">Active Directory &amp; Windows</text>
<text x="42" y="178" fill="#64748b" font-size="9.5">secretsdump · psexec · nxc · bloodhound</text>
<rect x="230" y="155" width="22" height="18" rx="4" fill="#0f172a" fill-opacity=".05"/>
<text x="241" y="168" text-anchor="middle" fill="#64748b" font-size="9" font-weight="700">AD</text>
</g>
</g>
</svg>
