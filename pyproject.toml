# Tool configuration only. The project ships through CMake/CPack and the
# platform packages, not as a Python distribution, so there is no [project] table.

[tool.ruff]
target-version = "py311"
# Build outputs and virtual environments are excluded through .gitignore
# (respect-gitignore is on by default).

[tool.ruff.lint]
# Conservative, high-signal set: pyflakes (F), the import / statement / runtime
# subsets of pycodestyle (E4, E7, E9) and bugbear (B). Layout rules (line length,
# import sorting, formatting) are left out on purpose: the code base uses a
# compact style.
select = ["F", "E4", "E7", "E9", "B"]
ignore = [
    "E401",  # several imports on one line: part of the compact style
    "E701",  # several statements on one line (colon): compact style
    "E702",  # several statements on one line (semicolon): compact style
    "E731",  # lambda assigned to a name: stylistic
    "E741",  # ambiguous single-letter names: stylistic
    "B007",  # unused loop variable: usual with tuple unpacking, no runtime effect
    "B905",  # zip() without strict=: strict mode is not wanted everywhere
]

[tool.ruff.lint.per-file-ignores]
# Known debt, waived file by file so the rules stay armed everywhere else.
# Drop an entry once its file is cleaned.
"core/api_keys.py" = ["F401"]           # unused import
"desktop/*.py" = ["F401"]               # stale imports left by the dead-code removals
"desktop/window.py" = ["E402", "B010"]  # imports after module-level setup; setattr with a constant
"desktop/updater.py" = ["F841"]         # worker reference assigned but never read
"desktop/storage.py" = ["B904"]         # raise inside except without `from`
"desktop/wsl_setup.py" = ["B904"]       # raise inside except without `from`
"scripts/build-desktop.py" = ["E402"]   # sys.path bootstrap before the project imports
"scripts/render-cli.py" = ["E402"]      # sys.path bootstrap before the project imports

[tool.mypy]
# Strict checking is limited to the modules that already carry annotations. The
# rest of the code base is only analysed for the types it exposes to them.
python_version = "3.11"
files = [
    "core/runner.py",
    "core/redaction.py",
    "core/backends",
    "core/update_service.py",
    "desktop/profiles.py",
]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# The Windows backend uses ctypes.WinDLL / WinError / get_last_error, which
# typeshed declares only for sys.platform == "win32"; checked from Linux every
# use would otherwise count as a missing attribute.
module = "core.backends.windows_api"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
